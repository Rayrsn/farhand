version: 2

updates:
  # Rust dependencies (Cargo.lock)
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"

  # GitHub Actions, pinned by commit SHA in our workflows — Dependabot updates
  # the SHAs (with the version comment) automatically.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    ignore:
      # dtolnay/rust-toolchain is pinned three times for three *different*
      # toolchains (stable, the 1.88.0 MSRV job, nightly). Dependabot models
      # the action as a single requirement, so an update collapses all three
      # pins to the newest commit — the `stable` tag — while the version
      # comments keep claiming 1.88.0/nightly. That would silently turn the
      # MSRV gate into a duplicate of the main build, so toolchain bumps are
      # made deliberately and by hand instead.
      - dependency-name: "dtolnay/rust-toolchain"

      # We have no CODECOV_TOKEN, so the upload is tokenless, and
      # codecov-action v5+ changed the tokenless path for public repositories.
      # Our job sets fail_ci_if_error: false so a flaky uploader cannot
      # redden the matrix — which also means a v5+ action that quietly stopped
      # uploading would stay green and freeze the badge. Revisit once a token
      # exists and a failed upload becomes loud and testable.
      - dependency-name: "codecov/codecov-action"
