name: Nightly

on:
  schedule:
    # 03:17 UTC daily — heavy verification that doesn't gate PRs.
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tsan:
    name: Thread sanitizer (library tests)
    runs-on: ubuntu-latest
    # Advisory during the first two weeks of running: TSan on hosted runners
    # is the most likely flake source in this repo. Once it has been green for
    # two consecutive weeks, flip this to `false` (blocking). The job is never
    # deleted — a sanitizer that is silently dropped is worse than a flaky one.
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust nightly (with rust-src for -Zbuild-std)
        uses: dtolnay/rust-toolchain@be39649afda95dbf70f87cce95f68b8d5797b296 # nightly
        with:
          toolchain: nightly
          components: rust-src

      - name: Library tests under ThreadSanitizer
        run: |
          RUSTFLAGS="-Zsanitizer=thread" \
          cargo +nightly test -Zbuild-std --target x86_64-unknown-linux-gnu \
            --workspace --lib

  fuzz:
    name: Fuzz (deep run)
    runs-on: ubuntu-latest
    # Advisory: this does not gate a PR, because a nightly fuzzer should not
    # be able to hold up a release. The fuzz-lite property tests that DO run on
    # every PR in all three CI jobs are the fast gate; this is the deep run, and
    # its results are the point.
    #
    # The hosted runner needs RUSTFLAGS (see the run step) because --build-std
    # compiles compiler_builtins with crt-static, which libFuzzer's sanitizer
    # rejects. That was previously written off as unfixable from a workflow; the
    # flag rustc names in the error turned out to be settable, and it is
    # verified locally. Whether the runner honours it is what this job reports.
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@be39649afda95dbf70f87cce95f68b8d5797b296 # nightly
        with:
          toolchain: nightly
          # --build-std (used on every fuzz run below) compiles std with
          # sanitizer instrumentation, which requires the rust-src component.
          components: rust-src

      - name: Install cargo-fuzz
        uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2
        with:
          tool: cargo-fuzz

      - name: Install musl-tools
        # cc-rs probes for a musl compiler while building the C shims in the
        # dependency graph (ring, via rustls) and errors when it cannot find
        # `x86_64-linux-musl-gcc`. The release workflow installs this same
        # package on this same runner, so it is known to be available.
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Deep fuzz each target (10 min)
        env:
          # libFuzzer's sanitizer cannot link a statically linked libc, and
          # --build-std compiles `compiler_builtins` with crt-static enabled,
          # which is what the hosted runner trips over. rustc names this flag
          # in the error itself, and RUSTFLAGS reaches the build-std units
          # because cargo-fuzz passes an explicit --target.
          RUSTFLAGS: "-C target-feature=-crt-static"
        run: |
          for target in fuzz_read_frame fuzz_unpack_tar fuzz_wire_paths; do
            echo "::group::$target"
            cargo +nightly fuzz run "$target" --build-std -- -max_total_time=600
            echo "::endgroup::"
          done

      - name: Upload crash artifacts (if any)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-crashes-nightly
          path: fuzz/artifacts
          if-no-files-found: ignore

  # The release workflow only runs when a tag is pushed, so a broken package
  # selector or a renamed binary there stays invisible until a release is
  # already cut. This runs the same build command every night.
  release-build-check:
    name: Release build (selector drift)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Build the release binaries with the release selectors
        run: cargo build --release --target x86_64-unknown-linux-gnu -p farhand-cli -p farhand-agent

      - name: The executables must be named fh and fhd
        run: |
          test -x target/x86_64-unknown-linux-gnu/release/fh
          test -x target/x86_64-unknown-linux-gnu/release/fhd
          ./target/x86_64-unknown-linux-gnu/release/fh --version
          ./target/x86_64-unknown-linux-gnu/release/fhd --version

  # The Homebrew formula was left pointing at v1.7.0 while v1.8.0 and v1.8.1
  # shipped, so `brew install farhand` handed people two releases of bugs —
  # including the Windows stack overflow. Nothing caught it because the
  # formula is not exercised by any test. This compares it against what is
  # actually published.
  homebrew-formula:
    name: Homebrew formula (version + checksums)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: The formula must match the latest published release
        env:
          # `gh` does not pick up GITHUB_TOKEN on its own; without this the
          # command fails on an auth prompt and `set -e` turns the whole check
          # into a permanent false alarm. contents:read is enough to read a
          # release.
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          latest=$(gh release view --json tagName --jq '.tagName' | sed 's/^v//')
          formula_version=$(sed -n 's/^  version "\(.*\)"$/\1/p' Formula/farhand.rb)
          echo "latest release: ${latest}"
          echo "formula version: ${formula_version}"
          if [ -z "${latest}" ]; then
            echo "::error::could not read the latest release tag; refusing to judge the formula against an empty value" >&2
            exit 1
          fi
          if [ "${latest}" != "${formula_version}" ]; then
            echo "::error::Formula/farhand.rb is at ${formula_version} but the latest release is ${latest}. Update the version and its checksums." >&2
            exit 1
          fi

      - name: Every formula checksum must match the published artifact
        run: |
          set -euo pipefail
          version=$(sed -n 's/^  version "\(.*\)"$/\1/p' Formula/farhand.rb)
          failures=0
          while read -r url digest; do
            asset=$(basename "${url}")
            published=$(curl -sL --max-time 60 \
              "https://github.com/Rayrsn/farhand/releases/download/v${version}/${asset}.sha256" \
              | awk '{print $1}')
            if [ "${published}" != "${digest}" ]; then
              echo "::error::${asset}: formula says ${digest}, release publishes ${published}" >&2
              failures=$((failures + 1))
            else
              echo "${asset}: checksum matches"
            fi
          done < <(awk '
            /url "/     { u=$0; sub(/^.*url "/, "", u);     sub(/"$/, "", u) }
            /sha256 "/  { d=$0; sub(/^.*sha256 "/, "", d); sub(/"$/, "", d); print u, d }
          ' Formula/farhand.rb)
          exit "${failures}"

  benchmarks:
    name: Benchmarks (trend artifact)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Run criterion benchmarks
        run: cargo bench --workspace

      - name: Archive criterion results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: criterion-$(github.run_number)
          path: target/criterion
          retention-days: 30
