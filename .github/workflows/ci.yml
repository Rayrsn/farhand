name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy, rustfmt

      - name: Install ALSA library headers (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Check code formatting
        run: cargo fmt --all --check

      - name: Run Clippy checks
        run: cargo clippy --workspace --all-targets -- -D warnings -D clippy::undocumented_unsafe_blocks

      - name: Run Workspace Tests
        run: cargo test --workspace --locked --verbose

  # The install and packaging scripts are how most people install farhand, and
  # nothing executes them: a package rename left `-p fh -p fhd` in
  # dist/package_release.sh and a stale name check in install.sh, and both sat
  # unnoticed because the scripts are never run. `bash -n` is the cheapest gate
  # that at least refuses a broken script.
  scripts:
    name: Shell scripts (syntax)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Every shell script must parse
        run: |
          set -euo pipefail
          for script in scripts/*.sh dist/*.sh; do
            echo "checking ${script}"
            bash -n "${script}"
          done

      - name: Every PowerShell installer must parse
        shell: pwsh
        run: |
          # install.ps1 and setup_remote_ssh.ps1 are 27 KB between them and are
          # the primary install path on Windows. Nothing executed them, so a
          # syntax error shipped broken and only a Windows user would find it.
          #
          # The parser alone is the cheap gate; PSScriptAnalyzer is installed
          # when available and skipped otherwise, so this cannot flake on a
          # runner without it.
          $failed = $false
          Get-ChildItem -Path scripts,dist -Filter *.ps1 -Recurse | ForEach-Object {
            Write-Host "parsing $($_.Name)"
            $errors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName, [ref]$null, [ref]$errors)
            if ($errors -and $errors.Count -gt 0) {
              $failed = $true
              $errors | ForEach-Object { Write-Error "$($_.Extent.File):$($_.Extent.StartLineNumber): $($_.Message)" }
            }
          }
          if ($failed) { exit 1 }

      - name: install.sh must not silently build from the working directory
        run: |
          # This check used to assert that install.sh's "fall back to building
          # the checkout you happen to be standing in" guard still matched this
          # repository's layout. That fallback is gone: it installed whatever
          # unrelated farhand checkout the working directory contained, under
          # the name Farhand, with no message.
          #
          # The guard is now inverted — assert the fallback cannot come back,
          # and that the script points at `cargo install` instead.
          if grep -qE 'cargo build .*farhand-(cli|agent)' scripts/install.sh; then
            echo "::error::install.sh builds farhand from the working directory again"
            exit 1
          fi
          grep -q 'cargo install farhand-cli' scripts/install.sh

  # The release ships musl binaries, but the test matrix only covers glibc,
  # macOS, and Windows. libc types differ between the two C libraries (e.g.
  # ioctl's request parameter is c_ulong on glibc and c_int on musl), so a
  # glibc-only check can be green while every musl artifact fails to build.
  # This job type-checks the whole workspace for the musl target on every PR.
  musl:
    name: musl target (release artifact)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Install musl-tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: musl

      - name: Type-check workspace for musl
        run: cargo check --workspace --all-targets --target x86_64-unknown-linux-musl --locked

  # Windows gives the main thread a 1 MiB stack; Linux gives it 8 MiB. Both
  # binaries used to need more than 1 MiB before doing any work, so on Windows
  # they aborted with STATUS_STACK_OVERFLOW (0xC00000FD) before printing
  # `--version` — the client was simply unusable there, and only the Windows
  # test job noticed. This job pins the limit so a regression fails here.
  stack:
    name: 1 MiB main-thread stack (Windows parity)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Build the binaries
        run: cargo build --locked -p farhand-cli -p farhand-agent

      - name: Both binaries must run within a 1 MiB stack
        run: |
          ulimit -s 1024
          ./target/debug/fh --version
          ./target/debug/fhd --version

  msrv:
    name: MSRV (1.88.0)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust 1.88.0
        uses: dtolnay/rust-toolchain@688313b0823df1393bcebb1b4add0438a6d36884 # 1.88.0
        with:
          toolchain: 1.88.0
          components: clippy, rustfmt

      - name: Install ALSA library headers
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - name: Check workspace compiles on MSRV
        run: cargo check --workspace --all-targets --locked

      - name: Run library tests on MSRV
        run: cargo test --workspace --lib --locked

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install ALSA library headers
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@be39649afda95dbf70f87cce95f68b8d5797b296 # nightly
        with:
          toolchain: nightly
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2
        with:
          tool: cargo-llvm-cov

      - name: Collect coverage (incl. e2e-spawned client/daemon processes)
        run: cargo llvm-cov --workspace --all-targets --lcov --output-path lcov.info

      - name: Print the coverage summary
        # The number is printed rather than uploaded somewhere. There is no
        # coverage service configured for this repository, and a badge fed by an
        # upload nobody checks is worse than no badge: it looks like coverage is
        # being tracked and is not. The lcov artifact below is the full data.
        run: cargo llvm-cov report --summary-only

      - name: Archive raw coverage file
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lcov
          path: lcov.info
          retention-days: 14

  dependency-policy:
    name: Dependency policy (cargo-deny + audit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: cargo-deny (advisories, bans, licenses, sources)
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          manifest-path: Cargo.toml

      - name: RustSec audit
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # The two binaries publish to crates.io as farhand-cli / farhand-agent, and
  # CONTRIBUTING documents a manual publish order. A manual procedure is not a
  # check: this repo carried path-dependency versions pinned a full minor
  # behind the workspace (1.8 while the workspace was 1.9) and nothing noticed.
  #
  # A `cargo publish --dry-run` over every crate is NOT the fix, and this job
  # previously was that. A crate cannot be dry-run until its intra-workspace
  # dependency is actually on the registry, so on any version bump every
  # non-leaf crate fails with "candidate versions found which didn't match" —
  # a gate that is red by construction. What actually catches the drift is
  # asserting the path-dependency versions match the workspace version, which
  # is offline, instant, and runs on every PR.
  packaging:
    name: Packaging (path-dep versions)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Every path dependency must carry the workspace version
        run: |
          set -euo pipefail
          # A line carrying both `version =` and `path =` is an
          # intra-workspace reference. Its version becomes the published
          # requirement, so it has to track the workspace version.
          # Compared at major.minor, because a path dep is normally written
          # `<major>.<minor>` while the workspace says `<major>.<minor>.<patch>`.
          # Those are the same requirement; a string compare would report drift
          # on every release.
          workspace_version="$(awk -F'"' '/^version = /{print $2; exit}' Cargo.toml | cut -d. -f1,2)"
          echo "workspace version: ${workspace_version}"
          failed=0
          checked=0

          # A line carrying both `version =` and `path =` is an
          # intra-workspace reference. Its version becomes the published
          # requirement, so it has to track the workspace version.
          for manifest in crates/*/Cargo.toml fuzz/Cargo.toml; do
            matches="$(grep 'path = ' "$manifest" | grep 'version = ' || true)"
            [ -n "$matches" ] || continue
            while IFS= read -r line; do
              [ -n "$line" ] || continue
              dep_version="$(printf '%s' "$line" | sed -n 's/.*version = "\([^"]*\)".*/\1/p' | cut -d. -f1,2)"
              dep_name="$(printf '%s' "$line" | sed -n 's/^ *\([A-Za-z0-9_-]*\) *=.*/\1/p')"
              checked=$((checked + 1))
              if [ "$dep_version" != "$workspace_version" ]; then
                echo "::error file=${manifest}::${dep_name} is pinned to ${dep_version} but the workspace is ${workspace_version}"
                failed=1
              fi
            done <<< "$matches"
          done

          if [ "$checked" -eq 0 ]; then
            echo "::error::found no path dependencies to check — the check is inert"
            exit 1
          fi
          if [ "$failed" -ne 0 ]; then
            echo "::error::path-dependency versions drifted from the workspace version"
            exit 1
          fi
          echo "All ${checked} path dependencies track ${workspace_version}."

      # Only the crates with no intra-workspace dependency can be dry-run
      # without their siblings already being published.
      - name: Dry-run the crates that have no path dependencies
        run: |
          set -euo pipefail
          for crate in farhand-protocol farhand-config; do
            echo "::group::$crate"
            cargo publish --dry-run --locked -p "$crate"
            echo "::endgroup::"
          done
