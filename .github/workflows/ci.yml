name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy, rustfmt

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Check code formatting
        run: cargo fmt --all --check

      - name: Run Clippy checks
        run: cargo clippy --workspace --all-targets -- -D warnings -D clippy::undocumented_unsafe_blocks

      - name: Run Workspace Tests
        run: cargo test --workspace --verbose

  # The release ships musl binaries, but the test matrix only covers glibc,
  # macOS, and Windows. libc types differ between the two C libraries (e.g.
  # ioctl's request parameter is c_ulong on glibc and c_int on musl), so a
  # glibc-only check can be green while every musl artifact fails to build.
  # This job type-checks the whole workspace for the musl target on every PR.
  musl:
    name: musl target (release artifact)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Install musl-tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: musl

      - name: Type-check workspace for musl
        run: cargo check --workspace --all-targets --target x86_64-unknown-linux-musl

  # Windows gives the main thread a 1 MiB stack; Linux gives it 8 MiB. Both
  # binaries used to need more than 1 MiB before doing any work, so on Windows
  # they aborted with STATUS_STACK_OVERFLOW (0xC00000FD) before printing
  # `--version` — the client was simply unusable there, and only the Windows
  # test job noticed. This job pins the limit so a regression fails here.
  stack:
    name: 1 MiB main-thread stack (Windows parity)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Build the binaries
        run: cargo build -p fh -p fhd

      - name: Both binaries must run within a 1 MiB stack
        run: |
          ulimit -s 1024
          ./target/debug/fh --version
          ./target/debug/fhd --version

  msrv:
    name: MSRV (1.88.0)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust 1.88.0
        uses: dtolnay/rust-toolchain@688313b0823df1393bcebb1b4add0438a6d36884 # 1.88.0
        with:
          toolchain: 1.88.0
          components: clippy, rustfmt

      - name: Check workspace compiles on MSRV
        run: cargo check --workspace --all-targets

      - name: Run library tests on MSRV
        run: cargo test --workspace --lib

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@be39649afda95dbf70f87cce95f68b8d5797b296 # nightly
        with:
          toolchain: nightly
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2
        with:
          tool: cargo-llvm-cov

      - name: Collect coverage (incl. e2e-spawned client/daemon processes)
        run: cargo llvm-cov --workspace --all-targets --lcov --output-path lcov.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4
        with:
          files: lcov.info
          # Public repos upload tokenless; never fail the whole matrix on a
          # flaky uploader — the lcov artifact below is the source of truth.
          fail_ci_if_error: false

      - name: Archive raw coverage file
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lcov
          path: lcov.info
          retention-days: 14

  fuzz-smoke:
    name: Fuzz smoke (libFuzzer)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@be39649afda95dbf70f87cce95f68b8d5797b296 # nightly
        with:
          toolchain: nightly
          # --build-std (used on every fuzz run below) compiles std with
          # sanitizer instrumentation, which requires the rust-src component.
          components: rust-src

      - name: Install cargo-fuzz
        uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2
        with:
          tool: cargo-fuzz

      - name: Fuzz frame reader (60s)
        run: cargo +nightly fuzz run fuzz_read_frame --build-std -- -max_total_time=60

      - name: Fuzz tar unpacker (60s)
        run: cargo +nightly fuzz run fuzz_unpack_tar --build-std -- -max_total_time=60

      - name: Fuzz wire-path parser (60s)
        run: cargo +nightly fuzz run fuzz_wire_paths --build-std -- -max_total_time=60

      - name: Upload crash artifacts (if any)
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fuzz-crashes
          path: fuzz/artifacts
          if-no-files-found: ignore

  dependency-policy:
    name: Dependency policy (cargo-deny + audit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: cargo-deny (advisories, bans, licenses, sources)
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          manifest-path: Cargo.toml

      - name: RustSec audit
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
