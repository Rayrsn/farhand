name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.0.0)"
        required: false
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  build-release:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            use_cross: false
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            use_cross: true
          - os: macos-latest
            target: x86_64-apple-darwin
            use_cross: false
          - os: macos-latest
            target: aarch64-apple-darwin
            use_cross: false
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            use_cross: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl-tools (Linux x86_64)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install cross (if required)
        if: matrix.use_cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build release binaries
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }} -p fh -p fhd
          else
            cargo build --release --target ${{ matrix.target }} -p fh -p fhd
          fi
        env:
          RUSTFLAGS: ${{ matrix.os == 'windows-latest' && '-C target-feature=+crt-static' || '' }}
        shell: bash

      - name: Package artifacts (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          TAG_NAME="${{ github.event.inputs.tag || github.ref_name }}"
          ARCHIVE_NAME="farhand-${TAG_NAME}-${{ matrix.target }}.tar.gz"
          DIRECT_NAME="farhand-${{ matrix.target }}.tar.gz"
          STAGE_DIR="farhand-${TAG_NAME}-${{ matrix.target }}"
          mkdir -p "${STAGE_DIR}/services"
          cp "target/${{ matrix.target }}/release/fh" "${STAGE_DIR}/fh"
          cp "target/${{ matrix.target }}/release/fhd" "${STAGE_DIR}/fhd"
          chmod 755 "${STAGE_DIR}/fh" "${STAGE_DIR}/fhd"
          [ -f "README.md" ] && cp "README.md" "${STAGE_DIR}/"
          [ -f "specs.md" ] && cp "specs.md" "${STAGE_DIR}/"
          [ -f "CHANGELOG.md" ] && cp "CHANGELOG.md" "${STAGE_DIR}/"
          [ -f "dist/services/fhd.service" ] && cp "dist/services/fhd.service" "${STAGE_DIR}/services/"
          [ -f "dist/services/com.farhand.fhd.plist" ] && cp "dist/services/com.farhand.fhd.plist" "${STAGE_DIR}/services/"
          tar -czf "${ARCHIVE_NAME}" "${STAGE_DIR}"
          cp "${ARCHIVE_NAME}" "${DIRECT_NAME}"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${ARCHIVE_NAME}" > "${ARCHIVE_NAME}.sha256"
            sha256sum "${DIRECT_NAME}" > "${DIRECT_NAME}.sha256"
          else
            shasum -a 256 "${ARCHIVE_NAME}" > "${ARCHIVE_NAME}.sha256"
            shasum -a 256 "${DIRECT_NAME}" > "${DIRECT_NAME}.sha256"
          fi
        shell: bash

      - name: Package artifacts (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          $TagName = if ("${{ github.event.inputs.tag }}") { "${{ github.event.inputs.tag }}" } else { $env:GITHUB_REF_NAME }
          $ArchiveName = "farhand-${TagName}-${{ matrix.target }}.zip"
          $DirectName = "farhand-${{ matrix.target }}.zip"
          $StageDir = "farhand-${TagName}-${{ matrix.target }}"
          New-Item -ItemType Directory -Path $StageDir
          Copy-Item "target/${{ matrix.target }}/release/fh.exe" -Destination "$StageDir/fh.exe"
          Copy-Item "target/${{ matrix.target }}/release/fhd.exe" -Destination "$StageDir/fhd.exe"
          if (Test-Path "README.md") { Copy-Item "README.md" -Destination "$StageDir/" }
          if (Test-Path "specs.md") { Copy-Item "specs.md" -Destination "$StageDir/" }
          if (Test-Path "CHANGELOG.md") { Copy-Item "CHANGELOG.md" -Destination "$StageDir/" }
          Compress-Archive -Path $StageDir -DestinationPath $ArchiveName
          Copy-Item $ArchiveName -Destination $DirectName
          $Hash = (Get-FileHash -Algorithm SHA256 -Path $ArchiveName).Hash.ToLower()
          "$Hash  $ArchiveName" | Out-File -FilePath "${ArchiveName}.sha256" -Encoding ASCII
          "$Hash  $DirectName" | Out-File -FilePath "${DirectName}.sha256" -Encoding ASCII
        shell: pwsh

      - name: Upload release assets
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            farhand-*
