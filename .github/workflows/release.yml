name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            use_cross: false
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            use_cross: true
          - os: macos-latest
            target: x86_64-apple-darwin
            use_cross: false
          - os: macos-latest
            target: aarch64-apple-darwin
            use_cross: false
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            use_cross: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross (if required)
        if: matrix.use_cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build release binaries
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }} -p fh -p fhd
          else
            cargo build --release --target ${{ matrix.target }} -p fh -p fhd
          fi
        shell: bash

      - name: Package artifacts (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ARCHIVE_NAME="farhand-${GITHUB_REF_NAME}-${{ matrix.target }}.tar.gz"
          STAGE_DIR="farhand-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "${STAGE_DIR}/services"
          cp "target/${{ matrix.target }}/release/fh" "${STAGE_DIR}/fh"
          cp "target/${{ matrix.target }}/release/fhd" "${STAGE_DIR}/fhd"
          chmod 755 "${STAGE_DIR}/fh" "${STAGE_DIR}/fhd"
          [ -f "README.md" ] && cp "README.md" "${STAGE_DIR}/"
          [ -f "specs.md" ] && cp "specs.md" "${STAGE_DIR}/"
          [ -f "dist/services/fhd.service" ] && cp "dist/services/fhd.service" "${STAGE_DIR}/services/"
          [ -f "dist/services/com.farhand.fhd.plist" ] && cp "dist/services/com.farhand.fhd.plist" "${STAGE_DIR}/services/"
          tar -czf "${ARCHIVE_NAME}" "${STAGE_DIR}"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${ARCHIVE_NAME}" > "${ARCHIVE_NAME}.sha256"
          else
            shasum -a 256 "${ARCHIVE_NAME}" > "${ARCHIVE_NAME}.sha256"
          fi
        shell: bash

      - name: Package artifacts (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          $Version = $env:GITHUB_REF_NAME.TrimStart('v')
          $ArchiveName = "farhand-${env:GITHUB_REF_NAME}-${{ matrix.target }}.zip"
          $StageDir = "farhand-${env:GITHUB_REF_NAME}-${{ matrix.target }}"
          New-Item -ItemType Directory -Path $StageDir
          Copy-Item "target/${{ matrix.target }}/release/fh.exe" -Destination "$StageDir/fh.exe"
          Copy-Item "target/${{ matrix.target }}/release/fhd.exe" -Destination "$StageDir/fhd.exe"
          if (Test-Path "README.md") { Copy-Item "README.md" -Destination "$StageDir/" }
          if (Test-Path "specs.md") { Copy-Item "specs.md" -Destination "$StageDir/" }
          Compress-Archive -Path $StageDir -DestinationPath $ArchiveName
          $Hash = (Get-FileHash -Algorithm SHA256 -Path $ArchiveName).Hash.ToLower()
          "$Hash  $ArchiveName" | Out-File -FilePath "${ArchiveName}.sha256" -Encoding ASCII
        shell: pwsh

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            farhand-*
