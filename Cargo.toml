[workspace]
resolver = "2"
members = [
    "crates/fh",
    "crates/fhd",
    "crates/protocol",
    "crates/fileset",
    "crates/workspace",
    "crates/templates",
    "crates/config",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Farhand Authors"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
tokio = { version = "1.38", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
clap = { version = "4.5", features = ["derive", "env"] }
byteorder = "1.5"
sha2 = "0.10"
hex = "0.4"
tempfile = "3.10"
futures = "0.3"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
