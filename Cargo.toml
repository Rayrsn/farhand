[workspace]
resolver = "2"
members = [
    "crates/fh",
    "crates/fhd",
    "crates/protocol",
    "crates/fileset",
    "crates/workspace",
    "crates/templates",
    "crates/config",
]

[workspace.package]
version = "1.4.0"
edition = "2021"
rust-version = "1.75"
authors = ["https://github.com/Rayrsn"]
description = "Zero-dependency remote build and test offloader for weak or battery-constrained machines"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Rayrsn/farhand"
homepage = "https://github.com/Rayrsn/farhand"
documentation = "https://github.com/Rayrsn/farhand#readme"
readme = "README.md"
keywords = ["build", "offload", "remote", "compiler", "cache"]
categories = ["development-tools", "command-line-utilities"]

[workspace.dependencies]
tokio = { version = "1.44", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
clap = { version = "4.5", features = ["derive", "env"] }
byteorder = "1.5"
sha2 = "0.11.0"
hex = "0.4"
tempfile = "3.17"
futures = "0.3"
tar = "0.4"
flate2 = "1.1"
zstd = "0.13"
walkdir = "2.5"
glob = "0.3"
libc = "0.2"
portable-pty = "0.9"
crossterm = "0.29"
notify = "8.2.0"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
