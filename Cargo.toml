[workspace]
resolver = "2"
members = [
    "crates/fh",
    "crates/fhd",
    "crates/protocol",
    "crates/fileset",
    "crates/workspace",
    "crates/templates",
    "crates/config",
]

[workspace.package]
version = "1.11.1"
edition = "2021"
rust-version = "1.88"
authors = ["https://github.com/Rayrsn"]
description = "Remote build and test offloader with zero external system binaries, for weak or battery-constrained machines"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Rayrsn/farhand"
homepage = "https://github.com/Rayrsn/farhand"
documentation = "https://github.com/Rayrsn/farhand#readme"
readme = "README.md"
keywords = ["build", "offload", "remote", "compiler", "cache"]
categories = ["development-tools", "command-line-utilities"]

[workspace.dependencies]
tokio = { version = "1.44", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
clap = { version = "4.5", features = ["derive", "env"] }
clap_complete = "4.5"
clap_mangen = "0.3"
# Audio output on non-Linux. Not built into the Linux/musl binary (Linux plays
# over the native PulseAudio protocol instead), so its libasound dependency never
# reaches the static musl artifact.
#
# `default-features = false, features = ["playback"]` is deliberate: rodio's
# default features pull in the symphonia decoders, which are MPL-2.0 and fail
# the cargo-deny licence gate. We only ever hand rodio PCM we parsed ourselves
# out of the embedded WAV, so `playback` (which is just `dep:cpal`) is the whole
# of what we need — no decoder, no copyleft.
rodio = { version = "0.21", default-features = false, features = ["playback"] }
sha2 = "0.11.0"
hex = "0.4"
tempfile = "3.17"
futures = "0.3"
tar = "0.4"
flate2 = "1.1"
zstd = "0.14"
walkdir = "2.5"
glob = "0.3"
libc = "0.2"
portable-pty = "0.9"
crossterm = "0.29"
notify = "8.2.0"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging"] }
rustls-pki-types = "1.0"
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
rayon = "1.10"
webpki-roots = "1.0"
criterion = "0.8"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
