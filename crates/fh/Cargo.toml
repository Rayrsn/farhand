[package]
name = "farhand-cli"
description = "Farhand CLI client: offload compilation, test, and build jobs to remote machines"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
name = "fh"

# Published as farhand-*, installed as the short names users actually type.
[[bin]]
name = "fh"
path = "src/main.rs"

[dependencies]
protocol = { package = "farhand-protocol", version = "1.11.0", path = "../protocol" }
fileset = { package = "farhand-fileset", version = "1.11.0", path = "../fileset" }
config = { package = "farhand-config", version = "1.11.0", path = "../config" }
templates = { package = "farhand-templates", version = "1.11.0", path = "../templates" }
tokio = { workspace = true, features = ["full"] }
clap = { workspace = true, features = ["derive", "env"] }
clap_complete.workspace = true
clap_mangen.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter", "json"] }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
futures = { workspace = true }
crossterm = { workspace = true }
notify = { workspace = true }
thiserror = { workspace = true }

# Audio output on non-Linux. Linux uses a raw PulseAudio native socket (no
# libasound link) so the static musl build stays dependency-free.
[target.'cfg(not(target_os = "linux"))'.dependencies]
rodio.workspace = true

[dev-dependencies]
fhd = { package = "farhand-agent", version = "1.11.0", path = "../fhd" }
workspace = { package = "farhand-workspace", version = "1.11.0", path = "../workspace" }
tempfile = { workspace = true }
# Only for the process-liveness probe in the cancellation e2e test
# (signal 0); already in the dependency graph via fhd/workspace.
libc = { workspace = true }
