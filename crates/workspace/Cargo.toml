[package]
name = "farhand-workspace"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Agent-side workspace storage for Farhand: content-addressable store, copy-on-write cloning, locks, GC, and run history"
authors.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true

[lib]
name = "workspace"

[dependencies]
protocol = { package = "farhand-protocol", version = "1.8", path = "../protocol" }
fileset = { package = "farhand-fileset", version = "1.8", path = "../fileset" }
sha2 = { workspace = true }
hex = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
walkdir = { workspace = true }
glob = { workspace = true }
templates = { package = "farhand-templates", version = "1.8", path = "../templates" }
tokio = { workspace = true, features = ["sync"] }
serde = { workspace = true }
serde_json = { workspace = true }
libc = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
criterion = { workspace = true }
fileset = { package = "farhand-fileset", version = "1.8", path = "../fileset" }
protocol = { package = "farhand-protocol", version = "1.8", path = "../protocol" }

[[bench]]
name = "cas_cow"
harness = false
