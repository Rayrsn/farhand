name: rust
description: Rust projects built with Cargo
match:
  anyFile:
    - Cargo.toml
outputs:
  - target/release
  - target/debug
outputsIgnore:
  - "*/deps"
  - "*/deps/*"
  - "*/build"
  - "*/build/*"
  - "*/incremental"
  - "*/incremental/*"
  - "*/.fingerprint"
  - "*/.fingerprint/*"
  - "*.d"
  - "*.rlib"
  - "*.rmeta"
ignoreExtra:
  - target
hints:
  installCommand: cargo fetch
  lockfiles:
    - Cargo.lock
