name: gradle
description: Java/Kotlin/Android projects built with Gradle
match:
  anyFile:
    - build.gradle
    - build.gradle.kts
    - settings.gradle
    - settings.gradle.kts
outputs:
  - build/libs/*.jar
  - build/outputs
ignoreExtra:
  - .gradle
  - build
hints:
  installCommand: gradle --dry-run
  lockfiles:
    - gradle.lockfile
