<svg xmlns="http://www.w3.org/2000/svg" width="380" height="54" viewBox="0 0 380 54" fill="none">
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="380" y2="54" gradientUnits="userSpaceOnUse">
      <stop stop-color="#181825"/>
      <stop offset="1" stop-color="#1e1e2e"/>
    </linearGradient>
    <linearGradient id="btn-grad" x1="12" y1="12" x2="42" y2="42" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF7A00"/>
      <stop offset="1" stop-color="#FF9E40"/>
    </linearGradient>
    <filter id="shadow" x="0" y="0" width="380" height="58" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Container -->
  <rect x="1" y="1" width="378" height="52" rx="26" fill="url(#bg-grad)" stroke="#313244" stroke-width="1.5"/>

  <!-- Play Circle Button -->
  <circle cx="27" cy="27" r="16" fill="url(#btn-grad)"/>
  <!-- Play Icon Triangle -->
  <polygon points="23,20 35,27 23,34" fill="#FFFFFF"/>

  <!-- Label & Audio Waveform -->
  <text x="54" y="24" fill="#CDD6F4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600">
    Pronounce: <tspan fill="#FF9E40">FAAAAAAAH</tspan>
  </text>

  <!-- Scrubber Track -->
  <rect x="54" y="32" width="260" height="4" rx="2" fill="#313244"/>
  <!-- Progress -->
  <rect x="54" y="32" width="110" height="4" rx="2" fill="#FF7A00"/>
  <!-- Scrubber Thumb -->
  <circle cx="164" cy="34" r="5" fill="#FFFFFF"/>

  <!-- Duration & Speaker -->
  <text x="322" y="37" fill="#A6ADC8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="500">
    0:02
  </text>
  <!-- Speaker Icon -->
  <g transform="translate(352, 20)">
    <path d="M1 4h2l3-3v10l-3-3H1V4z" fill="#A6ADC8"/>
    <path d="M8 2c1.5 1.5 1.5 4.5 0 6M9.5 0.5c2.5 2.5 2.5 7 0 9.5" fill="none" stroke="#A6ADC8" stroke-width="1.2" stroke-linecap="round"/>
  </g>
</svg>
